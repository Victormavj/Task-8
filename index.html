<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Victor M.">
    <title>My Page</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="page-content">
        <h1>My Page</h1>
        <p>Have a question? Send me a message.</p>
        <button class="open-button" id="openFormButton" type="button">Contact me</button>
    </main>

    <div class="modal" id="contactModal" aria-hidden="true">
        <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="formTitle">
            <button class="close-button" id="closeFormButton" type="button" aria-label="Close contact form">&times;</button>
            <h2 id="formTitle">Contact form</h2>
            <p class="form-intro">Fill in the fields below and I will get back to you.</p>

            <form id="contactForm">
                <div class="form-grid">
                    <div class="form-field">
                        <label for="fullName">Full name</label>
                        <input id="fullName" name="fullName" type="text" autocomplete="name" required>
                    </div>

                    <div class="form-field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" autocomplete="email" required>
                    </div>

                    <div class="form-field">
                        <label for="phone">Phone</label>
                        <input id="phone" name="phone" type="tel" autocomplete="tel" required>
                    </div>

                    <div class="form-field">
                        <label for="organization">Organization</label>
                        <input id="organization" name="organization" type="text" autocomplete="organization">
                    </div>

                    <div class="form-field message-field">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="3" required></textarea>
                    </div>
                </div>

                <label class="consent-field" for="consent">
                    <input id="consent" name="consent" type="checkbox" required>
                    <span>I agree to the processing of my personal data.</span>
                </label>

                <button class="submit-button" id="submitButton" type="submit">Send message</button>
                <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
            </form>
        </section>
    </div>

    <footer>Victor M.</footer>
</body>
</html>
